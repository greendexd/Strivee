services:
  - type: web
    name: the-quest-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: the-quest-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: the-quest-backend
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npx tsc
    startCommand: cd server && node dist/src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: the-quest-db
          property: connectionString

databases:
  - name: the-quest-db
    plan: free
    region: oregon # Replace with your preferred region if needed
